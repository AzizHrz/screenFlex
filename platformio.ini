; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1 
framework = arduino

; build_src_filter = +<main.cpp> +<Mylog.cpp> +<IR_Module.cpp> +<RTC_module.cpp> +<RGBModule.cpp> +<ButtonModule.cpp> +<network_stack.cpp> +<WoL_Task.cpp>
; build_src_filter = +<test_rtc_http.cpp> +<Mylog.cpp> +<IR_Module.cpp> +<RTC_module.cpp> +<RGBModule.cpp> +<ButtonModule.cpp> 
; build_src_filter = +<test_IR_module.cpp> +<Mylog.cpp> ; +<IR_Module.cpp> 
; build_src_filter = +<correctTimeNTP.cpp> +<Mylog.cpp>  +<RTC_module.cpp>
; build_src_filter = +<correctTimeNTP.cpp> +<RTC_module.cpp> +<RTC_DS1302> +<Mylog.cpp>

;build_src_filter = +<tst.cpp> +<Mylog.cpp> +<network_stack.cpp> +<RGBModule.cpp> +<ButtonModule.cpp> +<IR_Module.cpp> 
;;;build_src_filter = +<tst.cpp> +<Mylog.cpp> +<IR_Module.cpp> +<RTC_module.cpp> +<RGBModule.cpp> +<ButtonModule.cpp> +<network_stack.cpp> +<WoL_Task.cpp>
build_src_filter = +<azizMain.cpp> +<Mylog.cpp> +<IR_Module.cpp> +<RTC_module.cpp> +<RGBModule.cpp> +<ButtonModule.cpp> +<network_stack.cpp> +<WoL_Task.cpp>

; build_src_filter = +<ethrn.cpp>
board_build.filesystem = littlefs
extra_scripts = pre:scripts/rename_output_bin.py
custom_prog_version = 1.1.0
build_flags = 
	-D VERSION=1.1.0
	-Wno-unknown-pragmas
lib_ldf_mode = deep+
lib_deps = 
	Arduino.Time
	adafruit/RTClib
  ; IRremoteESP8266
	-DHTTPUPDATE_H
	https://github.com/PaulStoffregen/Time
	arduino-libraries/NTPClient@^3.2.1
	treboada/Ds1302@^1.0.3
	bblanchon/ArduinoJson@^6.21.0
	khoih-prog/Ethernet_Generic
	
monitor_speed = 115200	
    

