; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
; build_src_filter= +<test_IR.cpp>    ;What program to be uploaded (  src  folder  we have  2  programs)
;build_src_filter = +<test\OTA_template.cpp> ;-<main.cpp> 
;build_src_filter =
;     +<*.cpp>           ; Include all other source files from src
;     -<main.cpp>             ; Exclude main.cpp
;      +<test\test_schedule.cpp> ; Include your test file
;      +<test\OTA_template.cpp> ; Include your test file
;     ; +<*.c>             ; Include C files if any
;      +<*>               ; Include library files

board_build.filesystem = littlefs
; extra_scripts = pre:gen_compile_commands.py 
extra_scripts =  pre:scripts/rename_output_bin.py
; extra_scripts =  pre:scripts/libdeps.sh
custom_prog_version = 1.1.0

build_flags =
    -D VERSION=1.1.0

monitor_speed = 115200

